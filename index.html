<html lang="fr">
<head>

<style>
/* VOICE: outil de travail, net et rassurant, comme une app bancaire.
   IDEA: le cahier de caisse et le classeur du comptable réunis dans le téléphone (caissier / patron).
   PICTURE: la bande verte du bénéfice, grand chiffre, en tête de l'écran patron ; les états imprimés comme des feuilles A4.
   COLOUR and TYPE: fond blanc, écritures orange #f07c00 et vert #009a55, touches de jaune #f9c22e, petits fonds teintés ; Space Grotesk + Inter.
   LAYOUT: colonne de téléphone (max 480px), onglets en bas, feuilles qui montent pour la saisie, aperçu A4 pour les PDF. */
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#1f2a24;--mut:#6f7a73;--line:#efe7dc;--g:#009a55;--gd:#008a4b;--o:#f07c00;--od:#d96d00;--y:#f9c22e;--mist:#e9f8ef;--ot:#fff3e6;--yt:#fff8dc;--red:#d32f2f;--amb:#e08600}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:92px}
h1,h2,h3,.num{font-family:"Space Grotesk",Inter,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;line-height:1.15}
header small{display:block;color:var(--mut);font:400 13px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.seg{display:flex;background:var(--mist);border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:none;font:600 14px Inter;color:var(--mut);padding:8px 11px;border-radius:9px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.band{background:var(--g);color:#fff;padding:22px 18px 20px}
.band .lab{font-size:14px;opacity:.92}
.band .big{font:700 clamp(32px,10vw,46px)/1.05 "Space Grotesk";margin:4px 0 6px;white-space:nowrap}
.band .sub{font-size:14px;opacity:.92}
.per{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.per button{border:1px solid #ffffff70;background:none;color:#fff;font:500 14px Inter;padding:7px 12px;border-radius:20px;min-height:36px;cursor:pointer}
.per button.on{background:#fff;color:#006b3e;border-color:#fff}
.per.dk button{border-color:var(--line);color:var(--ink)}.per.dk button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{font-size:13px;color:var(--mut)}
.kpi b{display:block;font:700 19px "Space Grotesk";white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
h2{font-size:17px;margin:22px 16px 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.list>button.row:first-child{border-top:0}
.row .t{flex:1}.row .t div{font-weight:500}.row .t small{color:var(--mut);font-size:13px}
.row .m{font:600 16px "Space Grotesk";white-space:nowrap;text-align:right}
.plus{color:var(--gd)}.moins{color:var(--red)}.x{text-decoration:line-through;opacity:.5}
.empty{padding:16px;color:var(--mut);font-size:14px}
.al{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}.al:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:left;font:600 15px Inter;color:var(--ink);min-height:62px;cursor:pointer}
.act small{display:block;font:400 13px Inter;color:var(--mut);margin-top:2px}
.act.in{border-left:4px solid var(--g)}.act.out{border-left:4px solid var(--red)}.act.mid,.act.stk{border-left:4px solid var(--amb)}
.btn{display:block;width:calc(100% - 32px);margin:12px 16px 0;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:600 16px Inter;padding:13px;min-height:50px;cursor:pointer}
.btn.g{background:var(--g);color:#fff}.btn.l{background:var(--mist);color:var(--ink)}.btn.r{background:none;color:var(--red);border:1px solid var(--red)}
.mini{border:0;background:none;color:var(--red);font:500 13px Inter;padding:8px 4px;min-height:36px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:9px 14px;border-top:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-family:"Space Grotesk";white-space:nowrap}
.tbl tr.tot td{font-weight:700;background:var(--mist)}
.note{font-size:13px;color:var(--mut);margin:8px 16px 0}
label.f{display:block;padding:10px 14px;border-top:1px solid var(--line)}label.f:first-child{border-top:0}
label.f span,.fld>span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;font:16px Inter;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);z-index:6}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;font:600 13px Inter;color:var(--mut);padding:12px 4px 16px;min-height:60px;cursor:pointer}
nav button.on{color:var(--gd);box-shadow:inset 0 3px 0 var(--g)}
.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;animation:up .22s ease-out}
.sheet h3{font-size:20px;margin:0 0 12px}
.fld{margin-bottom:12px}
.modes{display:flex;gap:6px;flex-wrap:wrap}.modes button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px Inter;border-radius:10px;min-height:44px;padding:0 8px;cursor:pointer}
.modes button.on{border-color:var(--g);background:var(--mist);font-weight:600}
.two{display:flex;gap:10px;margin-top:6px}.two .btn{margin:0;width:auto;flex:1}
.ln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 36px;grid-template-areas:'a a a x' 'u q p .';gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);align-items:center}.la{grid-area:a}.lx{grid-area:x}.lu{grid-area:u}.lq{grid-area:q}.lp{grid-area:p}
.ln input,.ln select{padding:8px;font-size:15px;min-height:42px}
.ln .mini{color:var(--mut);font-size:18px}
.add{border:1px dashed var(--line);background:none;color:var(--gd);font:600 14px Inter;border-radius:10px;width:100%;min-height:42px;cursor:pointer;margin-bottom:12px}
.ok{color:var(--gd);font-weight:600}.ko{color:var(--red);font-weight:600}.warn{color:var(--amb);font-size:13px}
.docs{display:grid;gap:8px;padding:0 16px}
.docs button{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:600 15px Inter;color:var(--ink);min-height:50px;cursor:pointer;text-align:left}
.docs button span{color:var(--gd);font-size:13px;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}
.pin{font:700 28px "Space Grotesk";letter-spacing:10px;text-align:center}
.setup{padding:24px 16px}.setup h2{margin:0 0 4px;font-size:26px}

/* Thème orange, blanc, vert, jaune */
.flag{height:4px;background:linear-gradient(90deg,var(--o) 0 33.3%,#fff 33.3% 66.6%,var(--g) 66.6%)}
header{border-bottom:1px solid var(--line);padding-top:10px}
header h1{color:var(--o)}header small{color:var(--gd);font-weight:500}
.seg{background:var(--ot)}.seg button.on{background:var(--o);color:#fff;box-shadow:none}
.band{background:linear-gradient(135deg,#00a35a,#008a4b);border-bottom:4px solid var(--y)}
.per button.on{background:var(--y);color:#3d2a00;border-color:var(--y)}
.per.dk button{border-color:#f3d9bd;color:var(--od);background:#fff}.per.dk button.on{background:var(--o);color:#fff;border-color:var(--o)}
h2{color:var(--o)}
.kpi{border:0}
.kpis .kpi:nth-child(3n+1){background:var(--mist)}.kpis .kpi:nth-child(3n+1) span{color:var(--gd)}
.kpis .kpi:nth-child(3n+2){background:var(--ot)}.kpis .kpi:nth-child(3n+2) span{color:var(--od)}
.kpis .kpi:nth-child(3n){background:var(--yt)}.kpis .kpi:nth-child(3n) span{color:#9a6c00}
.kpi span{font-weight:500}
.list{border-color:var(--line)}
.row .t div{color:var(--ink)}
.act{border:0;border-left:0}
.act.in{background:var(--mist);color:var(--gd)}.act.out{background:var(--ot);color:var(--od)}.act.mid,.act.stk{background:var(--yt);color:#946500}
.act small{color:var(--mut)}
.act.in{border-left:4px solid var(--g)}.act.out{border-left:4px solid var(--o)}.act.mid,.act.stk{border-left:4px solid var(--y)}
.btn{background:var(--o);color:#fff}.btn.g{background:var(--g)}.btn.l{background:var(--yt);color:#6b4a00}.btn.r{background:#fff}
.tbl tr.tot td,label.f+.row[style]{background:var(--yt)}
.docs button{border-color:#f3d9bd;background:#fff;color:var(--ink)}.docs button span{color:#fff;background:var(--g);padding:3px 9px;border-radius:20px;font-weight:600}
.docs button:nth-child(odd) span{background:var(--o)}
nav{border-top:1px solid var(--line)}nav button.on{color:var(--o);box-shadow:inset 0 3px 0 var(--o)}
input,select{background:#fff;border-color:#e6ddd1}input:focus,select:focus{border-color:var(--o)}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--o)}
.modes button.on{border-color:var(--o);background:var(--ot);color:var(--od)}
.add{color:var(--o);border-color:#f3d9bd}
.sheet .in h3{color:var(--o)}
.setup h2{color:var(--o)}
.dot{box-shadow:0 0 0 3px #fff}
.doc .dh{border-bottom-color:var(--o)}.doc .dh b,.doc h4{color:#d96d00}.doc th{background:#e9f8ef;color:#006b3a}.doc tr.tot td{background:#fff8dc}
/* contacts & détail */
.chk{display:flex;gap:10px;align-items:center;padding:12px;background:var(--yt);border-radius:12px;margin:0 0 12px;font-weight:600;color:#6b4a00;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--o);flex:none}
.wa{display:block;text-align:center;text-decoration:none;background:#25d366;color:#fff;border-radius:14px;padding:13px;font-weight:600;margin-top:10px}
.lnew{grid-column:1/-1;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:var(--yt);border-radius:10px}.lnew [data-nn]{grid-column:1/-1}
.ok.note{color:var(--gd)}
.coh{all:unset;cursor:pointer;font:inherit;color:inherit}.coh span{font-size:13px;color:var(--mut)}.coh:focus-visible{outline:3px solid var(--o)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:middle;background:transparent}.sdot.ok{background:var(--g)}.sdot.wait{background:var(--o)}.sdot.off{background:#9aa39e}
.bnr{padding:9px 16px;font-size:14px}.bnr.y{background:var(--yt);color:#6b4a00}.bnr.r{background:#fdecec;color:#a52020}
.lnk{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;color:inherit}button.lnk{display:inline}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1f2a24;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;transition:.25s;z-index:20;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet .in{animation:none}}
/* Aperçu et impression A4 */
#prev{position:fixed;inset:0;background:#3a3f3c;z-index:10;display:none;flex-direction:column}
#prev.open{display:flex}
#prev .bar{display:flex;gap:8px;padding:10px;background:#1d211f}
#prev .bar .btn{margin:0;width:auto;flex:1}
#prev .scrollp{overflow:auto;flex:1;padding:12px}
.paper{background:#fff;color:#111;max-width:800px;margin:0 auto 12px;padding:24px 20px;box-shadow:0 2px 10px #0006}
.doc{font:12.5px/1.45 Inter,Arial,sans-serif;color:#111}
.doc .dh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #00a862;padding-bottom:8px;margin-bottom:12px}
.doc .dh b{font:700 16px "Space Grotesk",Arial}
.doc h4{font:700 18px "Space Grotesk",Arial;margin:4px 0 2px}
.doc .ds{color:#555;margin-bottom:12px}
.doc table{width:100%;border-collapse:collapse;margin-bottom:14px}
.doc th,.doc td{border:1px solid #cfd6d2;padding:5px 7px;text-align:left;vertical-align:top}
.doc th{background:#eafaf2;font-weight:600}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc tr.tot td{font-weight:700;background:#f3f5f4}
.doc .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc .ft{color:#777;font-size:11px;border-top:1px solid #ddd;padding-top:6px;margin-top:6px}
.doc .pb{break-before:page;page-break-before:always}
#print{display:none}
@media print{@page{size:A4;margin:12mm}body{background:#fff}body>*:not(#print){display:none!important}#print{display:block}.doc{font-size:11px}}
</style>

<div class="app" id="app"></div>
<nav id="navw"><div id="nav"></div></nav>

<div id="prev"><div class="bar"><button class="btn l" id="pclose">Fermer</button><button class="btn g" id="pprint">Enregistrer en PDF / Imprimer</button></div><div class="scrollp"><div class="paper" id="ppaper"></div></div></div>
<div id="print"></div>
<datalist id="unitsG"><option value="pièce"><option value="paquet"><option value="carton"><option value="sac"><option value="bidon"><option value="boîte"><option value="kg"><option value="litre"><option value="mètre"><option value="rouleau"><option value="lot"></datalist>

<script>
{
/* ---------- Outils ---------- */
const DAY=864e5;
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'−':'')+Math.round(Math.abs(n)).toLocaleString('fr-FR')+' F';
const fn=n=>n?Math.round(n).toLocaleString('fr-FR'):'';
const fq=n=>(Math.round(n*100)/100).toLocaleString('fr-FR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sMs=i=>new Date(i+'T00:00:00').getTime(), eMs=i=>sMs(i)+DAY-1;
const dfr=i=>new Date(i+'T12:00:00').toLocaleDateString('fr-FR');
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const hash=s=>{let x=5381;for(const c of 'mgp#'+s)x=((x<<5)+x+c.charCodeAt(0))|0;return (x>>>0).toString(36)};
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const byNom=(a,b)=>a.nom.localeCompare(b.nom,'fr',{numeric:true});
const isD=a=>!!(a&&a.du&&+a.k>1);
const qu=(q,a)=>{if(!isD(a)||q<0)return fq(q)+(a&&a.u?' '+esc(a.u):'');const w=Math.floor(q+1e-9),r=Math.round((q-w)*a.k*100)/100;const p=[];if(w)p.push(fq(w)+(a.u?' '+esc(a.u):''));if(r)p.push(fq(r)+' '+esc(a.du));return p.join(' + ')||'0'+(a.u?' '+esc(a.u):'')};
const gM=()=>{const g=S&&S.cfg.marge;return g===undefined||g===null||g===''?5:+g};
const mMin=a=>a&&a.mm!==undefined&&a.mm!==null&&a.mm!==''?+a.mm:gM();
const mg=(p,c)=>c>0?(p-c)/c*100:Infinity;
const pmin=(c,a)=>Math.ceil(c*(1+mMin(a)/100));
const pc=x=>x===Infinity?'—':(Math.round(x*10)/10).toLocaleString('fr-FR')+' %';
const lowM=(a,m)=>{const x=m[a.id],c=a.svc?+a.cr||0:x?x.c:+a.pa0||0,r=[];if(!(c>0))return r;if(+a.pv&&mg(+a.pv,c)<mMin(a))r.push({u:a.u||'unité',p:+a.pv,c,min:pmin(c,a),m:mg(+a.pv,c)});if(isD(a)){const cd=c/a.k;if(mg(pvd(a),cd)<mMin(a))r.push({u:a.du,p:pvd(a),c:cd,min:pmin(cd,a),m:mg(pvd(a),cd)})}return r};
const pvd=a=>+a.pvd||Math.round(a.pv/a.k);
const pvs=a=>fmt(+a.pv)+(a.u?' / '+esc(a.u):'')+(isD(a)?' · '+fmt(pvd(a))+' / '+esc(a.du):'');
const lab=a=>esc(a.nom)+(a.ref?' · '+esc(a.ref):'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Plan comptable (SYSCOHADA, utilisé en arrière-plan) ---------- */
const CPT={'101':'Capital','104':"Compte de l'exploitant",'244':'Matériel et mobilier','31':'Marchandises','401':'Fournisseurs','411':'Clients','521':'Banque','531':'Mobile Money','571':'Caisse','601':'Achats de marchandises','6031':'Variation des stocks de marchandises','605':'Eau, électricité','608':'Emballages, fournitures','618':'Transport','622':'Loyer','624':'Entretien, réparations','628':'Téléphone, internet','641':'Impôts et taxes','658':'Autres charges','661':'Salaires','701':'Ventes de marchandises','706':'Prestations de services','621':'Sous-traitance','632':'Honoraires','627':'Publicité','625':'Assurances','6047':'Fournitures de bureau et consommables','631':'Frais bancaires','6043':'Produits d’entretien','616':'Carburant et déplacements','602':'Achats de matières premières et fournitures liées','241':'Matériel et outillage','245':'Matériel de transport','2841':'Amortissements du matériel et outillage','2844':'Amortissements du matériel et mobilier','2845':'Amortissements du matériel de transport','681':'Dotations aux amortissements','481':'Fournisseurs d’investissements','32':'Matières premières et intrants','36':'Produits finis','6032':'Variation des stocks de matières premières','73':'Variation des stocks de produits (production stockée)','702':'Ventes de produits finis','707':'Produits accessoires','71':'Subventions d’exploitation','756':'Cotisations des membres','757':'Dons et libéralités reçus','758':'Produits divers','771':'Intérêts et produits financiers','671':'Intérêts et frais financiers','891':'Impôts sur le résultat'};
const TR={caisse:'571',momo:'531',banque:'521'};
const MODES={caisse:'Espèces',momo:'Mobile Money',banque:'Banque'},MODEL=Object.assign({},MODES,{credit:'À crédit'});
const KS={m:{st:'31',va:'6031',ac:'601',ve:'701'},mp:{st:'32',va:'6032',ac:'602',ve:'707'},pf:{st:'36',va:'73',ac:'601',ve:'702'}};
const kindOf=a=>a&&!a.svc?(a.kind||'m'):null;
const splitAcc=(o,f,sign)=>{const M={};let t=0;for(const l of o.lines||[]){const v=l.q*l.p,ac=f(art(l.a));M[ac]=(M[ac]||0)+v;t+=v}const ks=Object.keys(M);if(!t)return null;let rest=o.m;return ks.map((k,i)=>{const v=i===ks.length-1?rest:Math.round(o.m*M[k]/t);rest-=v;return sign?[k,v,0]:[k,0,v]}).filter(x=>x[1]||x[2])};
const prodSplit=o=>splitAcc(o,a=>a&&a.svc?'706':KS[kindOf(a)||'m'].ve,0)||[[o.nat==='s'?'706':'701',0,o.m]];

const stockRun=(tEnd,trace)=>{
 const m={},mv=[],sc={};for(const a of S.arts)if(!a.svc)m[a.id]={q:+a.q0||0,c:+a.pa0||0};
 const push=(o,l,e,s)=>{if(trace&&l.a===trace)mv.push({t:o.t,lib:olib(o),e,s,q:m[l.a].q,c:m[l.a].c})};

  if(o.type==='prod'){let cost=+o.xc||0;for(const l of o.lines){const x=m[l.a];if(!x)continue;const q=bq(l);cost+=q*Math.max(x.c,0);x.q-=q;push(o,l,0,q)}const y=o.out&&m[o.out.a];if(y&&o.out.q>0){const u=cost/o.out.q;y.c=y.q>0?(y.q*y.c+o.out.q*u)/(y.q+o.out.q):u;y.q+=o.out.q;push(o,o.out,o.out.q,0)}continue}

const head=(t,p)=>`<div class="dh"><div><b>${esc(S.cfg.nom)}</b><br>${esc(S.cfg.act)}</div><div style="text-align:right">Édité le ${new Date().toLocaleDateString('fr-FR')}<br>Ma Gestion Pro</div></div><h4>${t}</h4><div class="ds">${p}</div>`;

const tb=(cols,rows,tot)=>`<table><tr>${cols.map(([l,n])=>`<th class="${n?'n':''}">${l}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${cols[i][1]?'n':''}">${v}</td>`).join('')}</tr>`).join('')}${tot?`<tr class="tot">${tot.map((v,i)=>`<td class="${cols[i][1]?'n':''}">${v}</td>`).join('')}</tr>`:''}</table>`;
const twoCols=(A,P,ta,tp,la,lp)=>`<div class="cols"><div>${tb([[la],['Montant',1]],A.map(a=>[esc(a[1]),fn(a[2])||'0']),['Total actif',fn(ta)])}</div><div>${tb([[lp],['Montant',1]],P.map(a=>[esc(a[1]),(a[2]<0?'−':'')+(fn(Math.abs(a[2]))||'0')]),['Total passif',fn(tp)])}</div></div>`;
const D={
 ouverture(){const u=S.ouv,A=[[0,'Matériel et équipements (net)',u.materiel+imOuvNet()],[0,'Stock de marchandises',stock0()],[0,'Clients',creOuv()],[0,'Banque',u.banque],[0,'Mobile Money',u.momo],[0,'Caisse',u.caisse]],P=[[0,typ()==='asso'?'Fonds associatifs':'Capital',capital()],[0,'Fournisseurs',detOuv()]];
  return head("Bilan d'ouverture",'Au '+dfr(S.cfg.debut))+twoCols(A,P,A.reduce((s,a)=>s+a[2],0),P.reduce((s,a)=>s+a[2],0),'Actif','Passif')+foot},
 journal(){const E=journal(du,au);let td=0,tc=0;const rows=[];
  for(const e of E)e.L.forEach(([c,d,k],i)=>{td+=d;tc+=k;rows.push([i?'':new Date(e.t).toLocaleDateString('fr-FR'),i?'':esc(e.lib),c,esc(CPT[c]),fn(d),fn(k)])});
  return head('Journal des opérations',`Du ${dfr(du)} au ${dfr(au)}`)+tb([['Date'],['Libellé'],['Compte'],['Intitulé'],['Débit',1],['Crédit',1]],rows,['','Totaux','','',fn(td),fn(tc)])+foot},

{if(S&&S.srv&&(!SES||(SES.role==='caissier'&&SES.ent!==S.cid))){S=null;DB.setCur(null)}
